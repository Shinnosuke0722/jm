[workspace]
resolver = "2"
members = ["crates/*"]

[package]
name = "jm"
version = "1.0.0"
edition = "2021"
rust-version = "1.82"
description = "Cross-platform JDK and Java version manager written in Rust"
authors = ["lfming0419"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/Shinnosuke0722/jm"
repository = "https://github.com/Shinnosuke0722/jm"
documentation = "https://github.com/Shinnosuke0722/jm#readme"
readme = "README.md"
keywords = ["java", "jdk", "openjdk", "version-manager", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
jm-core = { path = "crates/jm-core" }
jm-api = { path = "crates/jm-api" }
jm-install = { path = "crates/jm-install" }
jm-shell = { path = "crates/jm-shell" }

clap = { version = "4", features = ["derive", "env", "string"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
anyhow = "1"
console = "0.15"
# comfy-table 7.2 switched to Rust 2024 edition; keep the declared Rust 1.82 MSRV.
comfy-table = "~7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
clap_complete = "4"
dialoguer = "0.11"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
tar = "0.4"
flate2 = "1"
# Release archives use standard Deflate compression. Avoid unrelated ZIP
# codecs and timestamp parsing that increase the dependency and audit surface.
zip = { version = "2", default-features = false, features = ["deflate"] }
toml = "0.8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "benchmarks"
harness = false

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "z"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "stream"] }
sha2 = "0.10"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
