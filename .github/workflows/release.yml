name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Match tag to Cargo package version
        run: |
          PACKAGE_VERSION=$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "jm") | .version')
          if [ "$GITHUB_REF_NAME" != "v$PACKAGE_VERSION" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match Cargo.toml version v$PACKAGE_VERSION" >&2
            exit 1
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: jm-linux-x86_64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            artifact: jm-linux-aarch64
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: jm-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: jm-macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: jm-windows-x86_64

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross --rev 55f847251389c5406df85579191c0eac412fab3a --locked

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --locked --release --target ${{ matrix.target }}

      - name: Build (cargo)
        if: "!matrix.use_cross"
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.artifact }}.tar.gz jm
          cd ../../..

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.artifact }}.zip jm.exe
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip

  universal-macos:
    name: Universal macOS binary
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: jm-macos-x86_64
      - uses: actions/download-artifact@v8
        with:
          name: jm-macos-aarch64

      - name: Create universal binary
        run: |
          mkdir -p x86_64 aarch64
          tar xzf jm-macos-x86_64.tar.gz -C x86_64
          tar xzf jm-macos-aarch64.tar.gz -C aarch64
          lipo -create x86_64/jm aarch64/jm -output jm
          tar czf jm-macos-universal.tar.gz jm

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: jm-macos-universal
          path: jm-macos-universal.tar.gz

  release:
    name: Create GitHub Release
    needs: [build, universal-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz *.zip > sha256sums.txt
          cat sha256sums.txt

      - name: Generate release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]( |$)" { found = 1; next }
            found && $0 ~ "^## \\[" { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > CHANGES.md
          test -s CHANGES.md

      - name: Generate Homebrew formula
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA_MACOS=$(grep 'jm-macos-universal.tar.gz' artifacts/sha256sums.txt | awk '{print $1}')
          SHA_LINUX_X86=$(grep 'jm-linux-x86_64.tar.gz' artifacts/sha256sums.txt | awk '{print $1}')
          SHA_LINUX_ARM=$(grep 'jm-linux-aarch64.tar.gz' artifacts/sha256sums.txt | awk '{print $1}')
          sed -e "s/VERSION_PLACEHOLDER/$VERSION/g" \
              -e "s/SHA256_MACOS_PLACEHOLDER/$SHA_MACOS/g" \
              -e "s/SHA256_LINUX_X86_64_PLACEHOLDER/$SHA_LINUX_X86/g" \
              -e "s/SHA256_LINUX_AARCH64_PLACEHOLDER/$SHA_LINUX_ARM/g" \
              packaging/homebrew/jm.rb > artifacts/jm.rb
          echo "Generated Homebrew formula for v$VERSION"
          cat artifacts/jm.rb

      - name: Generate Scoop manifest
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA_WIN=$(grep 'jm-windows-x86_64.zip' artifacts/sha256sums.txt | awk '{print $1}')
          sed -e "s/VERSION_PLACEHOLDER/$VERSION/g" \
              -e "s/SHA256_WINDOWS_PLACEHOLDER/$SHA_WIN/g" \
              packaging/scoop/jm.json > artifacts/jm.json
          echo "Generated Scoop manifest for v$VERSION"
          cat artifacts/jm.json

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: CHANGES.md
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/sha256sums.txt
            artifacts/jm.rb
            artifacts/jm.json
