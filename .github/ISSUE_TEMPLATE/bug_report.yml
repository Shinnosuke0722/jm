name: Bug report
description: Report a reproducible problem with jm
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve jm. Search existing issues before filing a new one.

        **Security notice:** Do not disclose vulnerabilities or secrets here. Follow the [security policy](https://github.com/Shinnosuke0722/jm/security/policy) for private reporting.

  - type: input
    id: jm_version
    attributes:
      label: jm version
      description: Run `jm --version` and paste the complete output.
      placeholder: "jm 1.0.0"
    validations:
      required: true

  - type: dropdown
    id: operating_system
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: input
    id: operating_system_version
    attributes:
      label: Operating system version
      description: Include the distribution and release where applicable.
      placeholder: "Windows 11 24H2, macOS 15.1, or Ubuntu 24.04"
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: CPU architecture
      options:
        - x86_64 / AMD64
        - ARM64 / AArch64
        - x86 / 32-bit
        - Other
    validations:
      required: true

  - type: dropdown
    id: shell
    attributes:
      label: Shell
      options:
        - PowerShell
        - Command Prompt (cmd.exe)
        - Bash
        - Zsh
        - Fish
        - Other
    validations:
      required: true

  - type: input
    id: shell_version
    attributes:
      label: Shell version
      description: Include the shell version if it is available.
      placeholder: "PowerShell 7.4.6 or Bash 5.2"
    validations:
      required: true

  - type: input
    id: jdk_distribution
    attributes:
      label: JDK distribution and version
      description: Enter the distribution and requested or active version. Use `Not applicable` if no JDK is involved.
      placeholder: "Temurin 21.0.5, Corretto 17, or Not applicable"
    validations:
      required: true

  - type: textarea
    id: command_output
    attributes:
      label: Command and output
      description: Paste the exact command and its complete sanitized output.
      render: shell
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that reproduces the problem.
      placeholder: |
        1. Run `jm install ...`
        2. Run `jm use ...`
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: What did you expect jm to do?
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual behavior
      description: What did jm do instead? Include exact error messages above where possible.
    validations:
      required: true

  - type: textarea
    id: doctor_output
    attributes:
      label: jm doctor output
      description: Run `jm doctor` and paste the output. If jm cannot run, enter `Not available` and explain why. Remove credentials, tokens, proxy URLs, private hostnames, usernames, and sensitive filesystem paths first.
      render: shell
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add logs, screenshots, related issues, or anything else that may help.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checklist
      options:
        - label: I searched the existing issues and did not find a duplicate.
          required: true
        - label: I removed secrets and sensitive personal or company information from this report.
          required: true
        - label: I agree to follow this project's Code of Conduct.
          required: true
