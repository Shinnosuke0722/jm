[package]
name = "jm-install"
version = "1.0.1"
edition = "2021"
rust-version = "1.97.1"
description = "JDK download, verification, and extraction for jm"
authors = ["lfming0419"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Shinnosuke0722/jm"

[dependencies]
jm-core = { path = "../jm-core" }
jm-api = { path = "../jm-api" }
thiserror = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# JDK ZIP archives use standard Deflate compression. Keep the reader focused
# on that format instead of enabling every optional ZIP codec.
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
indicatif = "0.18"
console = "0.16"
tempfile = "3"
futures-util = "0.3"

[target.'cfg(windows)'.dependencies]
junction = { version = "2", default-features = false }
