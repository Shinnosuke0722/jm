[package]
name = "jm-install"
version = "1.0.1"
edition = "2021"
rust-version = "1.82"
description = "JDK download, verification, and extraction for jm"
authors = ["lfming0419"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Shinnosuke0722/jm"

[dependencies]
jm-core = { path = "../jm-core" }
jm-api = { path = "../jm-api" }
thiserror = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tar = "0.4"
flate2 = "1"
# JDK ZIP archives use standard Deflate compression. Keep the reader focused
# on that format instead of enabling every optional ZIP codec.
zip = { version = "2", default-features = false, features = ["deflate"] }
# 0.18.5 raises its MSRV to Rust 1.85; 0.18.4 is the latest release that
# supports the workspace's declared Rust 1.82 baseline.
indicatif = "=0.18.4"
console = "0.15"
tempfile = "3"
futures-util = "0.3"

[target.'cfg(windows)'.dependencies]
junction = { version = "2", default-features = false }
